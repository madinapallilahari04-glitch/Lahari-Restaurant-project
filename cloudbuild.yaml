# Google Cloud Build & Cloud Run Pipeline
steps:
  # 1. Build Docker image with Google Artifact Registry / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/lahari-restaurant:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/lahari-restaurant:latest', '.']

  # 2. Push Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lahari-restaurant:$COMMIT_SHA']

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'lahari-restaurant'
      - '--image'
      - 'gcr.io/$PROJECT_ID/lahari-restaurant:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/lahari-restaurant:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/lahari-restaurant:latest'
